{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 | Villen</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0c;
            font-family: "Poppins", sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .matrix {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 0.15;
            z-index: -1;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: 5px;
            color: #11ff88;
            text-shadow: 0 0 20px #11ff88;
        }

        p {
            font-size: 1.3rem;
            margin: 15px 0 30px;
            opacity: 0.8;
        }

        a {
            text-decoration: none;
            padding: 12px 28px;
            background: #11ff88;
            color: #000;
            font-weight: 600;
            border-radius: 8px;
            box-shadow: 0 0 12px #11ff88;
            transition: 0.3s;
        }

        a:hover {
            background: #0f0;
            transform: translateY(-3px);
            box-shadow: 0 0 20px #0f0;
        }

        /* Typing effect */
        .typing {
            white-space: nowrap;
            border-right: 2px solid #11ff88;
            overflow: hidden;
            width: 26ch;
            animation: typing 3s steps(26), blink 0.7s infinite step-start;
        }

        @keyframes typing {
            from {
                width: 0
            }
        }

        @keyframes blink {
            50% {
                border-color: transparent
            }
        }
    </style>
</head>

<body>

    <!-- Matrix Animation -->
    <canvas class="matrix"></canvas>

    <div class="container">
        <h1>404</h1>
        <p class="typing">Oops... Villen couldn't trace this page.</p>
        <a href="{% url 'core:home' %}">Go Back Home</a>
    </div>

    <script>
        // Matrix Animation Script
        const canvas = document.querySelector(".matrix");
        const ctx = canvas.getContext("2d");

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = "01";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#11ff88";
            ctx.font = fontSize + "px monospace";

            drops.forEach((y, index) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, index * fontSize, y * fontSize);

                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[index] = 0;
                drops[index]++;
            });
        }
        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });
    </script>

</body>

</html>
