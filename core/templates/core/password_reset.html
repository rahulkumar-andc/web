{% extends 'core/base.html' %}

{% block title %}Reset Password - Villen{% endblock %}

{% block content %}
<div class="form-container" style="max-width:500px;margin:40px auto;background:#1e1e1e;padding:30px;border-radius:10px;">
    <h2 class="text-center" style="color:#00ff9d;">🔐 Reset Password</h2>

    <p>Enter your registered email. We will send you a reset link.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}

        <button class="btn btn-villen mt-3" type="submit">Send Reset Link</button>
    </form>
</div>
{% endblock %}
