{% extends 'core/base.html' %}

{% block title %}Set New Password - Villen{% endblock %}

{% block content %}
<div class="form-container" style="max-width:500px;margin:40px auto;background:#1e1e1e;padding:30px;border-radius:10px;">
    <h3 style="color:#00ff9d;">🔑 Set New Password</h3>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-villen mt-2" type="submit">Update Password</button>
    </form>
</div>
{% endblock %}
