{% extends "custom_admin/base.html" %}
{% block title %}Edit Blog Post{% endblock %}

{% block content %}
<div class="mb-8 flex items-center space-x-4">
    <a href="{% url 'custom_admin:blog_list' %}" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
        <i class="fas fa-arrow-left text-gray-600 dark:text-gray-400"></i>
    </a>
    <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Edit Blog Post</h1>
        <p class="text-gray-600 dark:text-gray-400 mt-1">{{ blog.title }}</p>
    </div>
</div>

<div class="max-w-3xl">
    <form method="post" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 p-6">
        {% csrf_token %}
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title *</label>
            <input type="text" name="title" value="{{ blog.title }}" required
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Image URL</label>
            <input type="url" name="image_url" value="{{ blog.image_url|default:'' }}"
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Content</label>
            <textarea name="content" rows="15" 
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">{{ blog.content }}</textarea>
        </div>
        
        <div class="mb-6">
            <label class="flex items-center space-x-3">
                <input type="checkbox" name="is_private" {% if blog.is_private %}checked{% endif %}
                    class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary">
                <span class="text-gray-700 dark:text-gray-300">Private Post</span>
            </label>
        </div>
        
        <div class="flex space-x-4">
            <button type="submit" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition">
                <i class="fas fa-save mr-2"></i>Save Changes
            </button>
            <a href="{% url 'custom_admin:blog_list' %}" class="px-6 py-2 border dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
