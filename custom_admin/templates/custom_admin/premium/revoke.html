{% extends "custom_admin/base.html" %}
{% block title %}Revoke Premium{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-10">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-900 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-ban text-3xl text-red-600 dark:text-red-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Revoke Premium Access</h1>
            <p class="text-gray-600 dark:text-gray-400">
                Remove premium access from <strong>{{ user_obj.username }}</strong>
            </p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Reason</label>
                <textarea name="reason" rows="3" required
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                    placeholder="Why is premium access being revoked?"></textarea>
            </div>
            
            <div class="flex space-x-4">
                <a href="{% url 'custom_admin:premium_users' %}" class="flex-1 px-6 py-3 border dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition text-center">
                    Cancel
                </a>
                <button type="submit" class="flex-1 px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                    <i class="fas fa-ban mr-2"></i>Revoke Access
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
