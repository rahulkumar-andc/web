{% extends "custom_admin/base.html" %}
{% block title %}Edit Service{% endblock %}

{% block content %}
<div class="mb-8 flex items-center space-x-4">
    <a href="{% url 'custom_admin:services_list' %}" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
        <i class="fas fa-arrow-left text-gray-600 dark:text-gray-400"></i>
    </a>
    <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Edit Service</h1>
        <p class="text-gray-600 dark:text-gray-400 mt-1">{{ service.title }}</p>
    </div>
</div>

<div class="max-w-2xl">
    <form method="post" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 p-6">
        {% csrf_token %}
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title *</label>
            <input type="text" name="title" value="{{ service.title }}" required
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Category</label>
            <select name="category" class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white">
                {% for value, label in category_choices %}
                <option value="{{ value }}" {% if service.category == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Icon (Font Awesome class)</label>
            <input type="text" name="icon" value="{{ service.icon }}"
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Image URL</label>
            <input type="url" name="image_url" value="{{ service.image_url|default:'' }}"
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
            <textarea name="description" rows="5" 
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">{{ service.description }}</textarea>
        </div>
        
        <div class="flex space-x-4">
            <button type="submit" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition">
                <i class="fas fa-save mr-2"></i>Save Changes
            </button>
            <a href="{% url 'custom_admin:services_list' %}" class="px-6 py-2 border dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
