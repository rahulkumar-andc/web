{% extends "custom_admin/base.html" %}
{% block title %}Edit Tool{% endblock %}

{% block content %}
<div class="mb-8 flex items-center space-x-4">
    <a href="{% url 'custom_admin:tools_list' %}" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
        <i class="fas fa-arrow-left text-gray-600 dark:text-gray-400"></i>
    </a>
    <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Edit Tool</h1>
        <p class="text-gray-600 dark:text-gray-400 mt-1">{{ tool.title }}</p>
    </div>
</div>

<div class="max-w-3xl">
    <form method="post" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 p-6">
        {% csrf_token %}
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title *</label>
            <input type="text" name="title" value="{{ tool.title }}" required
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Category</label>
            <input type="text" name="category" value="{{ tool.category }}"
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Image URL</label>
                <input type="url" name="image_url" value="{{ tool.image_url|default:'' }}"
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Video URL</label>
                <input type="url" name="video_url" value="{{ tool.video_url|default:'' }}"
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
            </div>
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Source Code URL</label>
            <input type="url" name="source_code_url" value="{{ tool.source_code_url|default:'' }}"
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Detailed Content</label>
            <textarea name="detailed_content" rows="10" 
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">{{ tool.detailed_content }}</textarea>
        </div>
        
        <div class="flex space-x-4">
            <button type="submit" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition">
                <i class="fas fa-save mr-2"></i>Save Changes
            </button>
            <a href="{% url 'custom_admin:tools_list' %}" class="px-6 py-2 border dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
