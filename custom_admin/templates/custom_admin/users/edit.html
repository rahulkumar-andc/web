{% extends "custom_admin/base.html" %}
{% block title %}Edit User: {{ user_obj.username }}{% endblock %}

{% block content %}
<div class="mb-8 flex items-center space-x-4">
    <a href="{% url 'custom_admin:user_detail' user_obj.id %}" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
        <i class="fas fa-arrow-left text-gray-600 dark:text-gray-400"></i>
    </a>
    <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Edit User</h1>
        <p class="text-gray-600 dark:text-gray-400 mt-1">{{ user_obj.username }}</p>
    </div>
</div>

<div class="max-w-2xl">
    <form method="post" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 p-6">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">First Name</label>
                <input type="text" name="first_name" value="{{ user_obj.first_name }}" 
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
                <input type="text" name="last_name" value="{{ user_obj.last_name }}" 
                    class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
            </div>
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
            <input type="email" name="email" value="{{ user_obj.email }}" 
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Phone Number</label>
            <input type="text" name="phone_number" value="{{ user_obj.phone_number|default:'' }}" 
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Bio</label>
            <textarea name="bio" rows="4" 
                class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary">{{ user_obj.bio }}</textarea>
        </div>
        
        <div class="mb-6 space-y-4">
            <label class="flex items-center space-x-3">
                <input type="checkbox" name="is_active" {% if user_obj.is_active %}checked{% endif %}
                    class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary">
                <span class="text-gray-700 dark:text-gray-300">Active</span>
            </label>
            <label class="flex items-center space-x-3">
                <input type="checkbox" name="is_staff" {% if user_obj.is_staff %}checked{% endif %}
                    class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary">
                <span class="text-gray-700 dark:text-gray-300">Staff Status</span>
            </label>
            <label class="flex items-center space-x-3">
                <input type="checkbox" name="email_verified" {% if user_obj.email_verified %}checked{% endif %}
                    class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary">
                <span class="text-gray-700 dark:text-gray-300">Email Verified</span>
            </label>
        </div>
        
        <div class="flex space-x-4">
            <button type="submit" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition">
                <i class="fas fa-save mr-2"></i>Save Changes
            </button>
            <a href="{% url 'custom_admin:user_detail' user_obj.id %}" class="px-6 py-2 border dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
